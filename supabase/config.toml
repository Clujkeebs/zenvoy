# Gateway settings for functions this repo deploys.
# recheck-saved is called by pg_cron, not by a signed-in browser.
# The function still rejects any request that does not carry
# RECHECK_CRON_SECRET. Other functions keep the platform default
# (a user JWT is required).

[functions.recheck-saved]
verify_jwt = false

# Called by pg_cron with the same RECHECK_CRON_SECRET header.
[functions.daily-digest]
verify_jwt = false

# A business owner opens a proof link with no account.
# The function checks the proof hash itself.
[functions.audit-interest]
verify_jwt = false

# Stripe calls this. It cannot send a user JWT.
# The function rejects any body whose Stripe signature does not match.
# This does not change prices or plans.
[functions.stripe-webhook]
verify_jwt = false

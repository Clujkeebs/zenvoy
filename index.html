  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Zenvylo",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "url": "https://zenvylo.app/",
    "image": "https://zenvylo.app/og-image.png",
    "description": "Finds real local businesses, measures each website, watches for changes, and publishes a checkable proof page. Outreach text cites only those measurements.",
    "featureList": [
      "OpenStreetMap business lookup",
      "Website measurement: HTTPS, mobile, response time, title, contact, booking, analytics",
      "Scores computed from measurements",
      "Re-check saved prospects and show what changed",
      "Shareable proof page with a verification code",
      "Follow-up dates and a daily desk",
      "CSV import"
    ],
    "offers": [
      { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD", "description": "3 scans per month, 5 leads per scan" },
      { "@type": "Offer", "name": "Starter", "price": "9", "priceCurrency": "USD", "description": "20 scans per month" },
      { "@type": "Offer", "name": "Growth", "price": "19", "priceCurrency": "USD", "description": "50 scans per month, all countries" },
      { "@type": "Offer", "name": "Pro", "price": "39", "priceCurrency": "USD", "description": "100 scans per month, AI outreach that cites measurements" },
      { "@type": "Offer", "name": "Scale", "price": "79", "priceCurrency": "USD", "description": "200 scans per month" }
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What does Zenvylo do?",
        "acceptedAnswer": { "@type": "Answer", "text": "It finds local businesses from OpenStreetMap, fetches each website, and records what is there. The score comes from those checks. Saved prospects can be measured again so you can see what changed." }
      },
      {
        "@type": "Question",
        "name": "Why not ask a chatbot for leads?",
        "acceptedAnswer": { "@type": "Answer", "text": "A chatbot can write an email. It cannot fetch the site, store the measurement, tell you later that the site went down or that booking appeared, or give the owner a page whose code is a hash of those measurements." }
      },
      {
        "@type": "Question",
        "name": "How much does Zenvylo cost?",
        "acceptedAnswer": { "@type": "Answer", "text": "Free is 3 scans a month. Paid plans are Starter $9, Growth $19, Pro $39 and Scale $79 per month. Enterprise is arranged by email." }
      }
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",

    "url": "https://zenvylo.app/",
    "logo": "https://zenvylo.app/icon-192.png",
    "email": "hello@zenvylo.app"
  }
  </script>
